<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TripSync — Log In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --teal: #0f4c4c;
    --teal-light: #1a6b6b;
    --coral: #ff6b5b;
    --coral-dark: #ec5344;
    --ink: #14201f;
    --muted: #8b978f;
    --border: #e7ebe9;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 15% 20%, #123b3b 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, #16504f 0%, transparent 45%),
      linear-gradient(135deg, #0a2e2e 0%, #0f4c4c 55%, #0a2626 100%);
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.35;
    animation: float 12s ease-in-out infinite;
    pointer-events: none;
  }
  .blob-1 { width: 320px; height: 320px; background: var(--coral); top: -80px; left: -80px; animation-delay: 0s; }
  .blob-2 { width: 260px; height: 260px; background: #35a79c; bottom: -60px; right: -60px; animation-delay: 2s; }
  .blob-3 { width: 180px; height: 180px; background: #ff9f7a; top: 55%; left: 8%; animation-delay: 4s; opacity: 0.2; }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(20px, -25px) scale(1.08); }
  }

  .card {
    position: relative;
    z-index: 1;
    display: flex;
    width: 100%;
    max-width: 920px;
    background: rgba(255,255,255,0.98);
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.06);
  }

  .panel {
    flex: 1;
    min-width: 320px;
    background:
      radial-gradient(circle at 30% 20%, rgba(255,107,91,0.25), transparent 55%),
      linear-gradient(160deg, #0f4c4c 0%, #0a2e2e 100%);
    color: #fff;
    padding: 52px 44px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }

  .panel::before {
    content: "";
    position: absolute;
    width: 200px;
    height: 200px;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 50%;
    top: -60px;
    right: -60px;
  }
  .panel::after {
    content: "";
    position: absolute;
    width: 320px;
    height: 320px;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 50%;
    bottom: -140px;
    right: -100px;
  }

  .panel-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    position: relative;
    z-index: 1;
  }

  .logo-mark {
    display: block;
    width: 64px;
    height: 64px;
    flex: 0 0 auto;
  }

  .welcome-label {
    font-size: 12px;
    letter-spacing: 2px;
    opacity: 0.65;
    margin-bottom: 10px;
    text-transform: uppercase;
    font-weight: 600;
  }

  .brand-title {
    font-size: 38px;
    font-weight: 800;
    line-height: 1.15;
    margin: 0 0 14px 0;
    letter-spacing: -0.5px;
  }

  .brand-title span { color: var(--coral); }

  .brand-sub {
    font-size: 14.5px;
    opacity: 0.75;
    margin: 0;
    max-width: 240px;
    line-height: 1.5;
  }

  .panel-mid {
    position: relative;
    z-index: 1;
    margin-top: 30px;
  }

  .feature-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    opacity: 0.85;
    margin-bottom: 12px;
  }

  .feature-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--coral);
    flex-shrink: 0;
  }

  .panel-bottom {
    font-size: 12.5px;
    opacity: 0.55;
    position: relative;
    z-index: 1;
  }

  .form-side {
    flex: 1;
    min-width: 340px;
    padding: 52px 48px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .form-title {
    font-size: 26px;
    font-weight: 800;
    margin: 0 0 6px 0;
    color: var(--ink);
    letter-spacing: -0.3px;
  }

  .form-subtitle {
    font-size: 13.5px;
    color: var(--muted);
    margin: 0 0 28px 0;
  }

  .field {
    position: relative;
    margin-bottom: 15px;
  }

  .field svg {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
  }

  .field input {
    width: 100%;
    padding: 13px 16px 13px 44px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
    background: #fafbfb;
  }

  .field input::placeholder { color: #a7b0ac; }

  .field input:focus {
    border-color: var(--teal-light);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(15,76,76,0.08);
  }

  .forgot-row {
    display: flex;
    justify-content: flex-end;
    margin: -2px 0 20px;
    font-size: 12.5px;
  }

  .forgot-row a {
    color: var(--teal);
    font-weight: 600;
    text-decoration: none;
  }
  .forgot-row a:hover { text-decoration: underline; }

  .btn-primary {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--coral) 0%, var(--coral-dark) 100%);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 0.2px;
    box-shadow: 0 10px 25px rgba(255,107,91,0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 30px rgba(255,107,91,0.45);
  }

  .btn-primary:active { transform: translateY(0); }

  .switch-text {
    text-align: center;
    font-size: 13.5px;
    color: var(--muted);
    margin-top: 24px;
  }

  .switch-text a {
    color: var(--teal);
    font-weight: 700;
    text-decoration: none;
  }
  .switch-text a:hover { text-decoration: underline; }

  @media (max-width: 760px) {
    .card { flex-direction: column; max-width: 440px; }
    .panel { padding: 36px 32px; }
    .panel::after { display: none; }
    .form-side { padding: 36px 32px; }
    .brand-title { font-size: 30px; }
  }
</style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="card">
    <div class="panel">
      <div class="panel-top">
        <div>
          <div class="welcome-label">Welcome to</div>
          <h1 class="brand-title">Trip<span>Sync</span></h1>
          <p class="brand-sub">Everyone's trip. One balance, always in sync.</p>
        </div>
        <svg class="logo-mark" viewBox="0 0 240 240" role="img" aria-label="TripSync logo" xmlns="http://www.w3.org/2000/svg">
          <circle cx="120" cy="120" r="114" fill="#FFFFFF" stroke="#121212" stroke-width="4"/>
          <circle cx="120" cy="120" r="104" fill="none" stroke="#121212" stroke-width="4"/>
          <circle cx="120" cy="120" r="99" fill="none" stroke="#121212" stroke-width="1.5" stroke-dasharray="180 20"/>
          <circle cx="120" cy="84" r="33" fill="#FACC15"/>
          <path d="M58 118 Q84 112 92 72 L92 162" fill="none" stroke="#121212" stroke-width="5" stroke-linecap="round"/>
          <path d="M92 78 Q122 122 192 124" fill="none" stroke="#121212" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M45 140 Q115 124 202 140" fill="none" stroke="#121212" stroke-width="5" stroke-linecap="round"/>
          <g transform="translate(132, 86) rotate(18)">
            <path d="M0 16 L48 12 L22 20 L14 34 L10 33 L14 21 L4 22 L0 27 L-3 26 L1 18 Z" fill="#121212"/>
            <path d="M18 14 L8 2 L14 2 L26 13 Z" fill="#121212"/>
          </g>
          <text x="120" y="172" text-anchor="middle" fill="#121212" font-family="Georgia, serif" font-size="22" letter-spacing="4">TRIPSYNC</text>
        </svg>
      </div>

      <div class="panel-mid">
        <div class="feature-row"><span class="feature-dot"></span> Split expenses automatically</div>
        <div class="feature-row"><span class="feature-dot"></span> Live balance recalculation</div>
        <div class="feature-row"><span class="feature-dot"></span> No more awkward money chats</div>
      </div>

      <div class="panel-bottom">© 2026 TripSync — Group travel, sorted.</div>
    </div>

    <div class="form-side">
      <h2 class="form-title">Welcome back</h2>
      <p class="form-subtitle">Log in to keep your trip in sync.</p>

      <form data-login-form onsubmit="event.preventDefault(); window.location.href = 'dashboard.html';">
        <div class="field">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 4h16v16H4z" stroke="none"/><path d="M22 6l-10 7L2 6"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>
          <input type="email" placeholder="Email" autocomplete="email" aria-label="Email" required>
        </div>

        <div class="field">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <input type="password" placeholder="Password" autocomplete="current-password" aria-label="Password" required>
        </div>

        <div class="forgot-row"><a href="#">Forgot password?</a></div>
        <button type="submit" class="btn-primary">Log in</button>
      </form>
      <p data-auth-message role="status" aria-live="polite" style="min-height:1.25em;margin:12px 0 0;text-align:center;font-size:13px;color:#8b3a32"></p>

      <p class="switch-text">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
  </div>

</body>
</html>
